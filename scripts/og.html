<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'BUDS Display';src:url('../assets/BUDSDisplay-Ultra.otf') format('opentype');font-weight:900}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#000;color:#fff;font-family:Archivo,sans-serif}
.wrap{position:relative;width:1200px;height:630px;display:flex}
.text{width:640px;padding:70px 0 70px 72px;display:flex;flex-direction:column;justify-content:space-between;box-sizing:border-box}
.kicker{font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.2em;color:#9a9a9a}
.title{font-family:'BUDS Display';font-size:150px;line-height:.85;letter-spacing:-.03em;margin:0}
.sub{font-size:24px;line-height:1.35;max-width:520px;color:#d4d4d4}
.img{position:absolute;right:0;top:0;width:560px;height:630px;overflow:hidden}
.img img{width:100%;height:100%;object-fit:cover;object-position:center top;filter:grayscale(1) contrast(1.05)}
.img::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#000 0%,rgba(0,0,0,0) 35%);z-index:1}
</style></head><body><div class="wrap">
<div class="text"><div class="kicker">Official Site — 2026</div><h1 class="title">BUDS</h1>
<div class="sub">Swiss-Brazilian artist, curator and musician from Biel/Bienne. Founder of Buds Fest.</div></div>
<div class="img"><img src="../assets/buds-hero.jpg"></div>
</div></body></html>
